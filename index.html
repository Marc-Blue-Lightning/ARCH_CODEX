<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCH_CODEX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="intro-screen">
        <div class="glitch-wrapper">
            <h1 class="glitch" data-text="LIGHTNING_OS">ARCH CODEX.</h1>
        </div>
        <p id="loading-text">Initialisation des protocoles...</p>
    </div>

    <main id="main-content" class="hidden">
        <header>
            <div class="status-bar">SYSTEM: ONLINE | ENCRYPTION: AES-READY</div>
            <h2>CRYPTO INTERFACE – BY MARC Lightning</h2>
        </header>

        <section class="terminal">
            <div class="input-group">
                <label>> ENTRER MESSAGE_</label>
                <textarea id="message" placeholder="Saisir texte..."></textarea>
            </div>

            <div class="config-row">
                <div class="field">
                    <label>> ALGO_</label>
                    <select id="algo-select">
                        <option value="cesar">César</option>
                        <option value="affine">Affine (a,b)</option>
                        <option value="vigenere">Vigenère</option>
                        <option value="autokey">AutoKey</option>
                        <option value="playfair">Playfair</option>
                    </select>
                </div>
                <div class="field">
                    <label>> CLÉ_</label>
                    <input type="text" id="key" placeholder="Valeur...">
                </div>
            </div>

            <div class="actions">
                <button onclick="execute(true)" class="btn-cipher">CHIFFRER</button>
                <button onclick="execute(false)" class="btn-decipher">DÉCHIFFRER</button>
            </div>

            <div class="output-group">
                <label>> RÉSULTAT_</label>
                <div id="result" class="result-box">_ATTENTE_SIGNAL...</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
